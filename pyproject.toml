[tool.poetry]
name = "realestate-pipeline"
version = "0.1.0"
description = "Real estate ingestion and analytics pipeline"
authors = ["Copilot <copilot@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "cloudscraper>=1.2.71",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
]
